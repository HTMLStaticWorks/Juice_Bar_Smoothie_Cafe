    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme toggling logic
            const themeBtns = document.querySelectorAll('.theme-toggle-btn');
            
            // Initial check
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            // Update icons based on initial state
            themeBtns.forEach(btn => {
                const icon = btn.querySelector('.material-symbols-outlined');
                if (icon) {
                    icon.textContent = document.documentElement.classList.contains('dark') ? 'light_mode' : 'dark_mode';
                }
                
                btn.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                    const isDark = document.documentElement.classList.contains('dark');
                    
                    if (isDark) {
                        localStorage.theme = 'dark';
                    } else {
                        localStorage.theme = 'light';
                    }
                    
                    // Update all buttons
                    themeBtns.forEach(b => {
                        const i = b.querySelector('.material-symbols-outlined');
                        if (i) {
                            i.textContent = isDark ? 'light_mode' : 'dark_mode';
                        }
                    });
                });
            });

            // RTL toggling logic
            const rtlBtns = document.querySelectorAll('.rtl-toggle-btn');
            
            // Initial check
            if (localStorage.dir === 'rtl') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }

            rtlBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const currentDir = document.documentElement.getAttribute('dir');
                    const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
                    document.documentElement.setAttribute('dir', newDir);
                    localStorage.dir = newDir;
                });
            });
        });
    </script>

    <!-- Simple Interaction Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const closeMenuBtn = document.getElementById('close-menu-btn');
            const sidenav = document.getElementById('sidenav');

            function toggleMenu() {
                if (sidenav) {
                    sidenav.classList.toggle('translate-x-full');
                }
            }

            if (mobileMenuBtn && sidenav && closeMenuBtn) {
                mobileMenuBtn.addEventListener('click', toggleMenu);
                closeMenuBtn.addEventListener('click', toggleMenu);
            }
        });
    </script>
